name: Bug Report
description: File a bug report to help us improve AxioCNC
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: (e.g. "When I click the 'Run Job' button, the job does not start.")
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop screenshots here or paste image URLs.

  - type: dropdown
    id: version
    attributes:
      label: AxioCNC Version
      description: What version of AxioCNC are you using?
      options:
        - "0.0.89"
        - "0.0.88"
        - "0.0.87"
        - "0.0.86"
        - "Older version"
    validations:
      required: true

  - type: checkboxes
    id: installation
    attributes:
      label: How Did You Install AxioCNC?
      description: Select all that apply.
      options:
        - label: Docker
        - label: Raspberry Pi deb file
        - label: Linux deb file
        - label: Downloaded the Desktop Application
        - label: Other (please specify in additional context)

  - type: dropdown
    id: controller
    attributes:
      label: CNC Controller
      description: Which CNC controller are you using?
      options:
        - "Grbl"
        - "Smoothieware"
        - "TinyG/g2core"
        - "Marlin"
        - "Other"
        - "Not applicable"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running?
      options:
        - "Linux"
        - "Windows"
        - "macOS"
        - "Raspberry Pi OS"
        - "Other"
        - "Not applicable (Docker)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Messages
      description: If applicable, paste any error messages, console logs, or server logs here.  Logs can be found in your user folder / .axiocnc/logs
      placeholder: Paste logs here (use code blocks for formatting).
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Any other information that might be helpful.

