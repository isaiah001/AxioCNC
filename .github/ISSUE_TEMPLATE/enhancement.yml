name: Feature Request / Enhancement
description: Suggest a new feature or enhancement for AxioCNC
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement! Please fill out the form below to help us understand your idea.

  - type: textarea
    id: description
    attributes:
      label: Enhancement Description
      description: A clear and concise description of the feature or enhancement you'd like to see.
      placeholder: (e.g. "I would like to see a dark mode theme option in the settings.")
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case / Motivation
      description: What problem does this solve? Why is this enhancement needed?
      placeholder: |
        Describe the problem or limitation you're facing, and how this enhancement would help.
        (e.g. "Currently, working in low-light conditions is difficult because the interface is too bright. A dark mode would improve usability.")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work? (Optional but helpful)
      placeholder: |
        Describe your ideal implementation or how you envision this feature working.
        (e.g. "Add a 'Theme' dropdown in Settings with 'Light' and 'Dark' options.")

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds? (Optional)
      placeholder: |
        Describe any alternative approaches you've thought about or tried.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Mockups
      description: If applicable, add screenshots, mockups, or examples from other software to illustrate your idea.
      placeholder: Drag and drop images here or paste image URLs.

  - type: dropdown
    id: version
    attributes:
      label: AxioCNC Version
      description: What version of AxioCNC are you using?
      options:
        - "0.0.87"
        - "0.0.86"
        - "Older version"
    validations:
      required: true

  - type: checkboxes
    id: installation
    attributes:
      label: How Did You Install AxioCNC?
      description: Select all that apply.
      options:
        - label: Docker
        - label: Raspberry Pi deb file
        - label: Linux deb file
        - label: Downloaded the Desktop Application
        - label: Other (please specify in additional context)

  - type: dropdown
    id: controller
    attributes:
      label: CNC Controller
      description: Which CNC controller are you using? (If relevant to this enhancement)
      options:
        - "Grbl"
        - "Smoothieware"
        - "TinyG/g2core"
        - "Marlin"
        - "Other"
        - "Not applicable"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running?
      options:
        - "Linux"
        - "Windows"
        - "macOS"
        - "Raspberry Pi OS"
        - "Other"
        - "Not applicable (Docker)"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, examples, or information about the enhancement here.
      placeholder: Any other information that might be helpful.
