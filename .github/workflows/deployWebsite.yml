# Workflow for building and deploying website (static + Docusaurus docs) to GitHub Pages
name: Deploy Website

on:
  push:
    branches: ["main"]
    paths:
      - 'website/**'
      - '.github/workflows/deployWebsite.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build User Docs Docusaurus
        working-directory: website/docs/user
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO || 'rsteckler/AxioCNC-Docs' }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY || 'Announcements' }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          DOCUSAURUS_APTABASE_APP_KEY: ${{ secrets.DOCUSAURUS_APTABASE_APP_KEY }}
          DOCUSAURUS_APTABASE_HOST: ${{ secrets.DOCUSAURUS_APTABASE_HOST || 'https://us.aptabase.com' }}
        run: pnpm build

      - name: Build Dev Docs Docusaurus
        working-directory: website/docs/developer
        env:
          GISCUS_REPO: ${{ secrets.GISCUS_REPO || 'rsteckler/AxioCNC-Docs' }}
          GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY || 'Announcements' }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          DOCUSAURUS_APTABASE_APP_KEY: ${{ secrets.DOCUSAURUS_APTABASE_APP_KEY }}
          DOCUSAURUS_APTABASE_HOST: ${{ secrets.DOCUSAURUS_APTABASE_HOST || 'https://us.aptabase.com' }}
        run: pnpm build

      - name: Prepare deployment
        run: |
          mkdir -p _site/docs _site/devdocs
          # Copy static website files to root, preserving permissions
          cp -r website/static/* _site/ 2>/dev/null || true
          # Ensure install scripts are executable and have correct permissions
          chmod +x _site/install-* 2>/dev/null || true
          # Verify install scripts are present (for debugging)
          ls -la _site/install-* || echo "Warning: Install scripts not found"
          # Copy User Docs Docusaurus build output (with baseUrl='/docs/', files are in build/ directly)
          if [ -d "website/docs/user/build" ]; then
            cp -r website/docs/user/build/* _site/docs/
          fi
          # Copy Dev Docs Docusaurus build output (with baseUrl='/devdocs/', files are in build/ directly)
          if [ -d "website/docs/developer/build" ]; then
            cp -r website/docs/developer/build/* _site/devdocs/
          fi
          # Ensure .nojekyll for GitHub Pages (prevents Jekyll processing)
          touch _site/.nojekyll _site/docs/.nojekyll _site/devdocs/.nojekyll

      # Inject Cloudflare Web Analytics token into static index.html.
      # Add site at https://dash.cloudflare.com/?to=/:account/web-analytics, then add
      # CLOUDFLARE_WEB_ANALYTICS_TOKEN as a repo secret (Settings → Secrets and variables → Actions).
      - name: Inject Cloudflare Web Analytics token
        if: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN != '' }}
        run: |
          sed -i 's|__CLOUDFLARE_WEB_ANALYTICS_TOKEN__|${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}|g' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
